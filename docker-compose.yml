version: "3.9"

services:
  # ── PostgreSQL Database ──────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: cortex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── CORTEX Application ──────────────────────────────────────
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # Database
      DATABASE_URL: postgresql://cortex:${DB_PASSWORD:?set DB_PASSWORD}@db:5432/cortex

      # Auth
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      CORTEX_ENCRYPTION_KEY: ${CORTEX_ENCRYPTION_KEY:?set CORTEX_ENCRYPTION_KEY}
      BASE_URL: ${BASE_URL:?set BASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?set TRUSTED_HOSTS}

      # OAuth (optional — leave blank to disable)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}

      # LLM Provider Keys (optional — can also set via Settings UI)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}

      # Misc
      CORTEX_ENV: ${CORTEX_ENV:-production}
      CORTEX_AUTHZ_FAIL_CLOSED: "true"
      ALLOW_SIGNUP: "false"
      CORTEX_BOOTSTRAP_TOKEN: ${CORTEX_BOOTSTRAP_TOKEN:?set CORTEX_BOOTSTRAP_TOKEN}
      SEED_SAMPLE_AGENTS: "false"
      SECURE_COOKIES: "true"
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    volumes:
      - appdata:/app/data

volumes:
  pgdata:
  appdata:
